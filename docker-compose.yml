services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ${OLLAMA_MODELS_PATH:-/mnt/user/appdata/ollama}:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  app:
    build: .
    image: job-board-watcher-app
    depends_on:
      - ollama
    ports:
      - "8501:8501"
    volumes:
      - ./.env:/app/.env
      - ./companies.json:/app/companies.json
      - ./profile:/app/profile
      - ./.tmp:/app/.tmp
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - TZ=${TZ:-America/Chicago}
    restart: unless-stopped

# ollama_models volume replaced with bind mount (see OLLAMA_MODELS_PATH in .env)
